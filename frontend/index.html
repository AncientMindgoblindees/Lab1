<!DOCTYPE html>
<html lang="en">

<!-- Head section defined meta information about the webpage -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Sensor Test</title>
    <link rel="stylesheet" href="style.css">
</head>

<!-- Body section contains the main content of the webpage -->
<!-- This is what the user actually sees-->
<body>
    <h1>Temperature Sensor Test</h1>

    <div>
        Sensor 1: <span id="sensor1_value">--</span> | Sensor 2: <span id="sensor2_value">--</span>
    </div>

    <button id="celsius_fahrenheit">Switch Unit</button>
    <button id="sensor1_button">Toggle Sensor 1</button>
    <button id="sensor2_button">Toggle Sensor 2</button>

    <!-- Canvas for plotting temperature data -->
    <canvas id="tempGraph"></canvas>

    <!-- Alerts -->
    <div id="alert" style="margin-top: 20px;">
        <h2>Alerts</h2>
        <label>Min Temp: <input type="number" id="min_temp" value=""></label><br>
        <label>Max Temp: <input type="number" id="max_temp" value=""></label><br>
        <label>Recipient Email: <input type="text" id="recipient" placeholder="Enter email"></label><br>
        <label>Message: <input type="text" id="alert_message" placeholder="Temperature out of range!"></label>
    </div>

    <!--EmailJS integration-->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
        (function(){
            emailjs.init("z3hjVeB34K-xmqXdc");
        })();
    </script>

    <!-- Script section for interactivity -->
    <script src="scripts.js"></script>
</body>
</html>
